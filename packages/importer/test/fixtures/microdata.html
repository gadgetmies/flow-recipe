<html><head><title>Pancakes</title></head>
<body>
<div itemscope itemtype="http://schema.org/Recipe">
  <h1 itemprop="name">Fluffy Pancakes</h1>
  <span itemprop="author" itemscope itemtype="http://schema.org/Person"><span itemprop="name">Jane</span></span>
  <meta itemprop="prepTime" content="PT10M">
  <time itemprop="cookTime" datetime="PT20M">20 minutes</time>
  <span itemprop="recipeYield">Serves 4 people</span>
  <ul>
    <li itemprop="recipeIngredient">200 g flour</li>
    <li itemprop="recipeIngredient">3 dl milk</li>
    <li itemprop="recipeIngredient">2 eggs</li>
  </ul>
  <div itemprop="recipeInstructions">
    <ol>
      <li>Whisk the flour, milk and eggs.</li>
      <li>Rest the batter for 10 minutes.</li>
      <li>Fry in a hot pan, 2 minutes per side.</li>
    </ol>
  </div>
</div>
</body></html>
